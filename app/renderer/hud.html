<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cairn</title>
    <style>
      :root {
        --void: #08090d;
        --ink: #eef0f6;
        --muted: #9298ab;
        --faint: #5f6579;
        --line: rgba(238, 240, 246, 0.09);
        --ember: #ff8f4c;
        --moss: #35d6a0;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /*
       * The glass panel.
       *
       * Three things make this read as glass rather than as a grey box: the
       * saturate() (without it, blurred colour behind goes muddy), the hairline
       * inner highlight along the top edge (how real frosted surfaces catch
       * light), and a shadow deep enough to lift it off whatever is behind.
       */
      #shell {
        margin: 12px;
        border-radius: 26px;
        /* Thinner tint over a heavier blur: the glass now carries more of the
           colour behind it and less of its own grey, which is what separates
           frosted glass from a dark panel with a blur behind it. */
        background:
          linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.02)),
          rgba(14, 16, 22, 0.55);
        backdrop-filter: blur(48px) saturate(200%);
        -webkit-backdrop-filter: blur(48px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.11);
        box-shadow:
          0 40px 90px -20px rgba(0, 0, 0, 0.82),
          0 2px 10px rgba(0, 0, 0, 0.4),
          /* Light along the top edge, shadow along the bottom — a pane has
             thickness, and only lighting both edges shows it. */
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          inset 0 -1px 0 rgba(0, 0, 0, 0.28);
        overflow: hidden;
        -webkit-app-region: drag;
        animation: panel-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes panel-in {
        from { opacity: 0; transform: translateY(14px) scale(0.975); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      input, button { -webkit-app-region: no-drag; font: inherit; }

      /* ------------------------------------------------------------ ask bar */
      #bar { display: flex; align-items: center; gap: 11px; padding: 16px; }

      #q {
        flex: 1; min-width: 0;
        background: transparent; border: 0; outline: none;
        color: var(--ink); font-size: 17px; padding: 12px 6px;
        letter-spacing: 0.1px;
      }
      #q::placeholder { color: var(--faint); }

      .btn {
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--ink);
        font-size: 14px;
        padding: 12px 17px;
        cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px;
        transition: background 160ms ease, transform 120ms ease, opacity 160ms ease, color 160ms ease;
      }
      .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
      .btn:active:not(:disabled) { transform: scale(0.97); }
      .btn:disabled { opacity: 0.28; cursor: default; }

      .btn.primary {
        background: var(--ember);
        color: var(--void);
        font-weight: 650;
        box-shadow: 0 6px 18px -6px var(--ember);
      }
      .btn.primary:hover:not(:disabled) { background: #ffa163; }

      #mic.recording {
        background: var(--ember); color: var(--void); font-weight: 650;
        box-shadow: 0 0 0 0 rgba(255, 143, 76, 0.5);
        animation: breathe 1.9s ease-out infinite;
      }
      @keyframes breathe {
        0%   { box-shadow: 0 0 0 0 rgba(255, 143, 76, 0.45); }
        70%  { box-shadow: 0 0 0 13px rgba(255, 143, 76, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 143, 76, 0); }
      }

      #hint {
        padding: 0 22px 15px;
        font-size: 12.5px;
        color: var(--faint);
        letter-spacing: 0.15px;
      }
      kbd {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.045);
        border-radius: 5px;
        padding: 1.5px 5px;
        font-family: inherit; font-size: 10.5px;
        color: var(--muted);
      }

      /* Level meter, only while recording. */
      #level { height: 0; overflow: hidden; transition: height 260ms cubic-bezier(0.22,1,0.36,1); padding: 0 18px; }
      #level.on { height: 16px; }
      #levelFill {
        height: 3px; width: 0%;
        background: linear-gradient(90deg, var(--ember), #ffc39a);
        border-radius: 999px;
        transition: width 80ms linear;
        box-shadow: 0 0 10px rgba(255,143,76,0.55);
      }

      /* ------------------------------------------------------------- answer */
      #answer { display: none; border-top: 1px solid var(--line); padding: 13px 18px 14px; }
      #answer.show { display: block; animation: rise 340ms cubic-bezier(0.22,1,0.36,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      #meta { display: flex; align-items: center; gap: 9px; font-size: 11.5px; font-weight: 600; margin-bottom: 9px; }
      #chip {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 4px 11px; border-radius: 999px;
      }
      #chip .dot { width: 6px; height: 6px; border-radius: 50%; }
      #ms { color: var(--faint); font-family: "Cascadia Mono", Consolas, monospace; font-weight: 500; }

      #say { display: flex; gap: 12px; font-size: 15px; line-height: 1.55; }
      #num {
        flex: 0 0 auto; width: 23px; height: 23px; border-radius: 50%;
        display: grid; place-items: center;
        font-size: 11px; font-weight: 700; color: var(--void);
        margin-top: 2px;
      }
      #text { animation: rise 300ms cubic-bezier(0.22,1,0.36,1) both; }

      #nav { display: flex; align-items: center; gap: 7px; margin-top: 12px; }

      /*
       * The step controls are deliberately smaller than the ask bar's.
       *
       * There are five of them once a walkthrough is running, and at the ask
       * bar's size they turned the panel into a toolbar — which is the wrong
       * emphasis for something that should sit under the step you are reading.
       */
      #nav .btn {
        padding: 7px 12px;
        font-size: 12.5px;
        border-radius: 11px;
      }
      #pips { display: flex; gap: 6px; margin-right: auto; }
      .pip {
        height: 5px; width: 5px; border-radius: 999px;
        background: rgba(255,255,255,0.16);
        transition: all 260ms cubic-bezier(0.22,1,0.36,1);
      }
      .pip.on { width: 24px; }

      #err {
        display: none;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        color: var(--ember);
        font-size: 13px;
        animation: rise 280ms cubic-bezier(0.22,1,0.36,1) both;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="bar">
        <button id="mic" class="btn" title="Speak your question">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="vertical-align:-2px">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span id="micLabel">Speak</span>
        </button>
        <input id="q" placeholder="Ask about what's on your screen…" autocomplete="off" />
        <button id="ask" class="btn primary">Ask</button>
      </div>

      <div id="hint">
        <kbd>Enter</kbd> ask · <kbd>Esc</kbd> close · <kbd>Ctrl</kbd><kbd>Space</kbd> from anywhere
      </div>
      <div id="level"><div id="levelFill"></div></div>

      <div id="err"></div>

      <div id="answer">
        <div id="meta">
          <span id="chip"><span class="dot"></span><span id="chipText"></span></span>
          <span id="ms"></span>
        </div>
        <div id="say"><div id="num">1</div><div id="text"></div></div>
        <div id="nav">
          <div id="pips"></div>
          <button id="captions" class="btn" title="Show captions on screen">CC</button>
          <button id="save" class="btn">Save as trail</button>
          <button id="replay" class="btn" title="Run the walkthrough again">Show me again</button>
          <button id="back" class="btn">Back</button>
          <button id="next" class="btn">Next</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const q = $("q"), askBtn = $("ask"), err = $("err"), answer = $("answer");
      const chip = $("chip"), chipText = $("chipText"), ms = $("ms");
      const num = $("num"), text = $("text"), pips = $("pips");
      const back = $("back"), next = $("next"), saveBtn = $("save"), replayBtn = $("replay");
      const mic = $("mic"), micLabel = $("micLabel");
      const level = $("level"), levelFill = $("levelFill");

      let result = null;
      let index = 0;
      let busy = false;
      // Kept because a saved trail stores the original wording, which is the
      // strongest key recall has for matching it later.
      let lastQuestion = "";

      // Walkthrough playback. `token` invalidates an in-flight sequence: a
      // pending speech callback from an abandoned run must not advance the new
      // one, and comparing a captured token is simpler than unwinding timers.
      let playing = false;
      let token = 0;
      let captionsOn = localStorage.getItem("cairn.captions") !== "0";

      /** Keeps the window exactly as tall as its contents. */
      function fit() {
        requestAnimationFrame(() =>
          window.cairn.resizeHud($("shell").offsetHeight + 24),
        );
      }

      function clearAnswer() {
        takeManualControl();   // stop any sequence still speaking
        answer.classList.remove("show");
        err.style.display = "none";
        result = null;
        index = 0;
        window.cairn.clear();
        fit();
      }

      function showError(message) {
        err.textContent = message;
        err.style.display = "block";
        answer.classList.remove("show");
        fit();
      }

      /**
       * Speaks a line and calls back when it finishes.
       *
       * The fallback timer matters more than it looks. SpeechSynthesis drops
       * `onend` fairly often — a cancel mid-utterance, a voice still loading, a
       * long line — and since the walkthrough advances on that callback, a
       * missed one would strand the sequence forever on step two. So a timer
       * sized to the text races it, and whichever fires first wins.
       */
      function speakThen(line, done, onWord) {
        let finished = false;
        let paced = null;
        const once = () => {
          if (finished) return;
          finished = true;
          clearInterval(paced);
          onWord?.(line);          // make sure the caption ends up complete
          done();
        };

        // ~55ms per character is roughly natural pace, plus a beat to read on.
        const fallback = setTimeout(once, Math.min(line.length * 55 + 1400, 14000));

        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(line);
          u.rate = 1.03;

          /*
           * `onboundary` fires as the voice reaches each word and carries the
           * character offset, which is what lets the caption build in step with
           * what is actually being said rather than on a guessed timer.
           *
           * Support is patchy — some Windows voices never fire it — so a paced
           * reveal starts alongside and is torn down the moment a real boundary
           * arrives. Whichever works, the caption keeps up.
           */
          let usingBoundaries = false;
          u.onboundary = (e) => {
            if (!usingBoundaries) { usingBoundaries = true; clearInterval(paced); }
            if (typeof e.charIndex === "number") onWord?.(line.slice(0, e.charIndex + (e.charLength ?? 0)));
          };

          if (onWord) {
            const words = line.split(/(\s+)/);
            let i = 0;
            onWord("");
            paced = setInterval(() => {
              if (usingBoundaries || i >= words.length) return clearInterval(paced);
              i += 1;
              onWord(words.slice(0, i).join(""));
            }, Math.max(90, Math.min(line.length * 55 / Math.max(words.length, 1), 320)));
          }

          u.onend = () => { clearTimeout(fallback); once(); };
          u.onerror = () => { clearTimeout(fallback); once(); };
          speechSynthesis.speak(u);
        } catch {
          clearTimeout(fallback);
          once();
        }
      }

      /**
       * Walks the whole answer on its own: point, explain, move on.
       *
       * Making someone press Next between every step turns being shown
       * something into operating a slideshow — and their attention is on their
       * own screen, not on this panel. When it reaches the end it offers to run
       * again rather than leaving the last step frozen on screen.
       */
      function play(from = 0) {
        if (!result) return;
        const mine = ++token;
        playing = true;
        index = from;
        render();

        const step = () => {
          if (mine !== token || !result) return;              // superseded
          const line = result.steps[index]?.say ?? "";
          speakThen(
            line,
            () => {
              if (mine !== token || !result) return;
              if (index < result.steps.length - 1) {
                index += 1;
                render();
                step();
              } else {
                playing = false;
                // Nothing left to say — surface the replay affordance.
                window.cairn.draw({ done: true });
              }
            },
            // Stream the caption as the voice reaches each word.
            (spoken) => {
              if (mine !== token) return;
              window.cairn.caption({ text: spoken, step: index, total: result.steps.length, show: captionsOn });
            },
          );
        };
        step();
      }

      /** Any manual navigation takes over; the sequence stops rather than fighting. */
      function takeManualControl() {
        token += 1;
        playing = false;
        try { speechSynthesis.cancel(); } catch {}
      }

      /** Renders one step and asks the overlay to point at it. */
      function render() {
        if (!result) return;
        const step = result.steps[index];
        const memory = result.source === "trail";
        const colour = memory ? "var(--moss)" : "var(--ember)";
        const rgba = memory ? "rgba(53,214,160,0.13)" : "rgba(255,143,76,0.13)";

        chip.style.background = rgba;
        chip.style.color = colour;
        chip.querySelector(".dot").style.background = colour;
        chipText.textContent = memory
          ? `From ${result.trail?.author?.name ?? "the team"}'s trail`
          : "Read from your screen";
        ms.textContent = `${result.elapsedMs}ms`;

        num.style.background = colour;
        num.textContent = String(index + 1);

        // Re-trigger the reveal so each step arrives rather than swapping.
        text.style.animation = "none";
        void text.offsetWidth;
        text.style.animation = "";
        text.textContent = step.say;

        pips.innerHTML = "";
        result.steps.forEach((_, i) => {
          const p = document.createElement("div");
          p.className = "pip" + (i === index ? " on" : "");
          if (i === index) p.style.background = colour;
          pips.appendChild(p);
        });

        back.disabled = index === 0;
        next.disabled = index >= result.steps.length - 1;
        // Only a fresh answer is worth saving; a recalled one is already saved.
        saveBtn.style.display = memory ? "none" : "";

        answer.classList.add("show");
        err.style.display = "none";
        fit();

        // Speech is driven by play(), not here — otherwise a manual Back would
        // start a second voice over the sequence already running.
        window.cairn.draw({
          target: step.target,
          label: step.label,
          tone: memory ? "moss" : "ember",
          bounds: window.__lastBounds,
          say: step.say,
          step: index,
          total: result.steps.length,
          captions: captionsOn,
        });
      }

      async function ask({ fromVoice = false, frame = null } = {}) {
        const question = q.value.trim();
        if (!question || busy) { if (fromVoice) stopVoiceFlow(); return; }
        const myFlow = flowId;
        busy = true;
        lastQuestion = question;
        saveBtn.disabled = false;
        saveBtn.textContent = "Save as trail";
        saveBtn.style.color = "";
        askBtn.disabled = true;
        askBtn.textContent = "…";
        err.style.display = "none";
        answer.classList.remove("show");

        /*
         * A typed question waits the same way a spoken one does.
         *
         * Only the voice flow handed the screen over, so pressing Enter left
         * the panel sitting there with a greyed-out button and nothing else to
         * say the question had been taken — the same silence that made the
         * voice wait feel broken. This has to happen before the clear below,
         * which hides the overlay unless the stage has claimed it.
         */
        if (!fromVoice) {
          voiceScreen = await window.cairn.activeScreen();
          window.cairn.voiceMode(true);
          startThinkingWords();
        }

        window.cairn.clear();
        fit();

        // Capture before the network call so the frame matches the question's
        // moment, not whatever is on screen when the answer lands.
        // A frame taken when Speak was pressed, if there is one. Falling back
        // to a fresh capture matters: the early one is taken before the
        // microphone is even granted, so a refusal there must not also cost
        // the screenshot.
        let shot = frame ? await frame : null;
        if (!shot?.ok) shot = await window.cairn.capture();

        if (myFlow !== flowId) { busy = false; askBtn.disabled = false; askBtn.textContent = "Ask"; return; }
        if (!shot.ok) {
          busy = false; askBtn.disabled = false; askBtn.textContent = "Ask";
          stopVoiceFlow();
          return showError(shot.error);
        }
        window.__lastBounds = shot.bounds;

        const res = await window.cairn.ask(question, shot.base64);
        busy = false; askBtn.disabled = false; askBtn.textContent = "Ask";

        // Escape while this was in flight: it has already put everything away,
        // so say nothing rather than reopening on top of whatever came next.
        if (myFlow !== flowId) return;

        // The waiting screen ends here either way, spoken or typed — the panel
        // comes back so the walkthrough's controls (captions, save, step
        // navigation) are reachable.
        stopVoiceFlow();
        if (!res.ok) return showError(res.error);

        result = res.result;
        play(0);
      }

      /* ------------------------------------------------------------ voice */

      let recorder = null, stream = null, recording = false;

      /*
       * The full-screen voice flow.
       *
       * The panel gets out of the way entirely: you are talking about your
       * screen, so the screen should be what you see. `screenBox` is captured
       * once at the start so every stage lands on the display you were looking
       * at, even if the mouse wanders mid-sentence.
       */
      let voiceScreen = null;
      let thinkingTimer = null;

      /*
       * Enough of these to outlast the answer.
       *
       * Three of them covered under six seconds, so a normal wait ran out of
       * words and looped — and "Looking at your screen…" arriving for the
       * second time eight seconds in reads as the app having started over.
       * These run in the order the work actually happens, and the last one is
       * open-ended on purpose: it holds rather than wrapping, so a slow answer
       * still says something true instead of restarting the story.
       */
      const THINKING_WORDS = [
        "Looking at your screen…",
        "Reading what's on it…",
        "Finding the right control…",
        "Working out the steps…",
        "Checking the order…",
        "Putting it together…",
        "Almost there…",
        "Still working…",
      ];

      function startThinkingWords() {
        let i = 0;
        const show = () => window.cairn.stage({
          kind: "thinking", text: THINKING_WORDS[i], ...voiceScreen,
        });
        show();
        // Slow enough to read, quick enough that the wait shows movement.
        thinkingTimer = setInterval(() => {
          if (i < THINKING_WORDS.length - 1) { i += 1; show(); }
        }, 1900);
      }

      function stopVoiceFlow() {
        clearInterval(thinkingTimer);
        thinkingTimer = null;
        window.cairn.stage({ kind: "off" });
        window.cairn.voiceMode(false);
      }

      /**
       * Errors have to be shown on the overlay while voice owns the screen.
       *
       * showError writes into the panel, and the panel is hidden during voice —
       * so a failure there produced a frozen screen and no explanation. Anything
       * that can fail mid-flow routes through here instead.
       */
      function failVoice(message) {
        window.cairn.stage({ kind: "thinking", text: message, hint: "", ...voiceScreen });
        setTimeout(() => { stopVoiceFlow(); showError(message); }, 2200);
      }

      let socket = null;

      /*
       * A transcription token, fetched before it is needed.
       *
       * Asking for one at the moment Speak is clicked put a round trip to the
       * server between the click and the point where anything you said was
       * being listened to — about two seconds, all of it after you had already
       * decided to talk. Summoning the panel is far enough ahead to have one
       * waiting.
       *
       * They last a minute, and a lease is refused well before that so a
       * socket can't open onto a credential that dies mid-sentence. Held to
       * one request per half minute: a token costs the same rate budget as a
       * transcription, and Ctrl+Space is cheap to press.
       */
      let tokenLease = null;

      function prefetchListenToken() {
        if (tokenLease && Date.now() - tokenLease.at < 30000) return;
        tokenLease = { at: Date.now(), promise: window.cairn.listenToken() };
      }

      function leaseListenToken() {
        const fresh = tokenLease && Date.now() - tokenLease.at < 30000;
        const promise = fresh ? tokenLease.promise : window.cairn.listenToken();
        tokenLease = null; // one token, one session
        return promise;
      }

      /*
       * The screen as it was when you pressed Speak.
       *
       * The shot used to be taken after your last word, so its cost landed
       * squarely in the wait you notice. Taken at the click instead, it
       * overlaps with the whole time you spend talking and is already in hand
       * when you stop. It is also the more honest moment: what you were
       * looking at when you decided to ask, rather than whatever the screen
       * drifted to while you finished the sentence.
       */
      let framePromise = null;

      /*
       * Identifies the current run so an abandoned one can't finish.
       *
       * Escape stops what is on screen, but a question already with the model
       * keeps coming — and arriving seconds later to start a walkthrough
       * nobody wants any more reads as the app ignoring the key. Escape moves
       * this on; anything holding an older value stops where it is.
       */
      let flowId = 0;

      /**
       * Live dictation.
       *
       * Audio streams to the transcription service as you speak and words come
       * back while you are still talking, rather than after. The earlier
       * version recorded, uploaded, then typed the result out — which meant the
       * whole sentence arrived at once, seconds late, and the typing animation
       * was decoration pretending to be responsiveness.
       *
       * Interim results are replaced as they firm up; finalised segments are
       * kept. That is why the text sometimes rewrites itself mid-sentence —
       * the service is revising its guess, and showing that is more honest than
       * hiding it behind a delay.
       */
      async function startRecording() {
        if (recording) return stopListening();

        /*
         * The screen changes hands before anything is fetched.
         *
         * Asking the server for a token is a round trip, and it used to happen
         * before a single pixel changed — so the click sat there doing nothing
         * visible for as long as the network took, which on a cold server was
         * over a second. The orb now appears immediately and admits it isn't
         * ready yet, which is both true and something you can see.
         */
        // This one is a plain send, not a request, so it takes effect in the
        // same tick as the click — the main process already knows which
        // display the pointer is on and paints the listening state itself.
        // Waiting to be told the screen bounds first put a round trip between
        // the click and any sign it had registered.
        window.cairn.voiceMode(true);
        err.style.display = "none";

        // The authoritative bounds, used for every frame after the first.
        voiceScreen = await window.cairn.activeScreen();
        window.cairn.stage({ kind: "listening", level: 0, hint: "Getting ready", ...voiceScreen });

        // Grab the screen now, while there is a sentence about to be spoken
        // over it. Nothing waits on this — it is collected when you stop.
        framePromise = window.cairn.capture();

        // Neither of these needs the other, so they overlap instead of queueing.
        const [tokenResult, micResult] = await Promise.allSettled([
          leaseListenToken(),
          navigator.mediaDevices.getUserMedia({ audio: true }),
        ]);

        // Both failures land on the overlay, which now owns the screen — the
        // panel is hidden and anything written there would go unseen.
        if (micResult.status !== "fulfilled") {
          return failVoice("No microphone available. Type your question instead.");
        }
        stream = micResult.value;

        const token = tokenResult.status === "fulfilled" ? tokenResult.value : null;
        if (!token?.ok) {
          try { stream.getTracks().forEach((t) => t.stop()); } catch {}
          return failVoice(token?.error ?? "Couldn't start live transcription. Type your question instead.");
        }

        recording = true;
        mic.classList.add("recording");
        micLabel.textContent = "Listening…";
        level.classList.add("on");

        // Browsers can't set an Authorization header on a socket, so the
        // credential rides in as a subprotocol. Which word precedes it depends
        // on what the server managed to issue — a session bearer token or a
        // short-lived key — so the server names the scheme rather than the
        // client assuming one.
        const params = new URLSearchParams({
          model: token.model || "nova-3",
          smart_format: "true",
          punctuate: "true",
          interim_results: "true",
          endpointing: "600",
        });
        socket = new WebSocket(
          `wss://api.deepgram.com/v1/listen?${params}`,
          [token.scheme || "token", token.key],
        );

        // Declared with `var` so the level-meter loop below, which lives in the
        // same function scope but runs after these are assigned, can read them.
        var settled = "";     // finalised segments
        var interim = "";     // the current best guess, replaced as it firms up

        // The meter redraws this several times a second, so it has to read the
        // current answer rather than carry a copy of the one true at setup.
        var listenHint = "Getting ready";

        socket.onopen = () => {
          // Only now is anything you say actually going anywhere. Saying "Go
          // ahead" while the socket was still connecting invited a first word
          // that nothing was listening for.
          listenHint = "Go ahead";
          window.cairn.stage({ kind: "listening", level: 0, hint: listenHint, ...voiceScreen });

          recorder = new MediaRecorder(stream, { mimeType: pickMime() });
          // Small slices so audio reaches the service continuously rather than
          // in one lump at the end.
          recorder.start(180);
          recorder.ondataavailable = (e) => {
            if (e.data.size && socket?.readyState === WebSocket.OPEN) socket.send(e.data);
          };
        };

        socket.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }
          const alt = msg?.channel?.alternatives?.[0];
          if (!alt) return;

          if (msg.is_final) { settled = (settled + " " + alt.transcript).trim(); interim = ""; }
          else { interim = alt.transcript ?? ""; }

          const live = (settled + " " + interim).trim();
          if (live) {
            // Still "listening", not "heard you" — the sentence is being
            // transcribed as it is spoken, and saying otherwise would imply
            // Cairn is waiting on you when it is keeping up with you.
            window.cairn.stage({ kind: "heard", text: live, hint: "Listening", ...voiceScreen });
          }
        };

        socket.onerror = () => { if (recording) failVoice("Lost the connection while listening."); };

        /** Ends dictation and moves on to the question. */
        window.__finishListening = () => {
          const heard = (settled + " " + interim).trim();
          try { recorder?.state === "recording" && recorder.stop(); } catch {}
          try { stream?.getTracks().forEach((t) => t.stop()); } catch {}
          try { socket?.close(); } catch {}
          socket = null;
          recording = false;
          mic.classList.remove("recording");
          micLabel.textContent = "Speak";
          level.classList.remove("on");

          if (!heard) return failVoice("Didn't catch that — try again, or type it.");
          q.value = heard;
          startThinkingWords();
          ask({ fromVoice: true, frame: framePromise });
          framePromise = null;
        };

        /*
         * The level meter also decides when you've finished.
         *
         * It waits for speech to actually begin before arming, so a slow start
         * doesn't cut you off before you've said anything, and only then treats
         * silence as the end of the sentence.
         */
        const ctx = new AudioContext();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        ctx.createMediaStreamSource(stream).connect(analyser);
        const buf = new Float32Array(analyser.fftSize);

        let spoke = false, quietSince = null;
        const started = Date.now();

        const tick = setInterval(() => {
          if (!recording) { clearInterval(tick); try { ctx.close(); } catch {} return; }

          analyser.getFloatTimeDomainData(buf);
          let sum = 0;
          for (const v of buf) sum += v * v;
          const rms = Math.sqrt(sum / buf.length);
          levelFill.style.width = `${Math.min(100, Math.round(rms * 900))}%`;

          // Only drive the orb before any words exist; once the transcript is
          // on screen it owns the stage, and re-sending a listening frame would
          // wipe the text mid-sentence.
          if (!settled && !interim) {
            window.cairn.stage({ kind: "listening", level: rms, hint: listenHint, ...voiceScreen });
          }

          const finish = () => { clearInterval(tick); try { ctx.close(); } catch {} window.__finishListening?.(); };

          if (rms > 0.015) { spoke = true; quietSince = null; }
          else if (spoke) {
            quietSince ??= Date.now();
            if (Date.now() - quietSince > 1100) return finish();
          }
          // Hard stop, so a noisy room can't listen forever.
          if (Date.now() - started > 20000) return finish();
        }, 100);
      }

      /** Manual stop, for clicking the mic again mid-sentence. */
      function stopListening() {
        window.__finishListening?.();
      }

      /** MediaRecorder support varies; take the first container it admits to. */
      function pickMime() {
        for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"]) {
          if (MediaRecorder.isTypeSupported?.(m)) return m;
        }
        return "";
      }

      /* ---------------------------------------------------------- wiring */

      mic.addEventListener("click", startRecording);
      askBtn.addEventListener("click", ask);

      back.addEventListener("click", () => {
        if (index > 0) { takeManualControl(); index--; render(); }
      });
      next.addEventListener("click", () => {
        if (result && index < result.steps.length - 1) { takeManualControl(); index++; render(); }
      });

      /* Captions are a preference, so the choice survives restarts. */
      const capBtn = $("captions");
      function paintCaptionToggle() {
        capBtn.style.background = captionsOn ? "rgba(255,255,255,0.16)" : "";
        capBtn.style.color = captionsOn ? "var(--ink)" : "var(--faint)";
        capBtn.title = captionsOn ? "Captions on — click to hide" : "Captions off — click to show";
      }
      capBtn.addEventListener("click", () => {
        captionsOn = !captionsOn;
        localStorage.setItem("cairn.captions", captionsOn ? "1" : "0");
        paintCaptionToggle();
        if (result) render();   // apply now rather than at the next step
      });
      paintCaptionToggle();

      /*
       * Replay lives in the panel now, not floating on the desktop.
       *
       * On the overlay it sat in the middle of the screen over the user's own
       * work, and it needed the overlay to borrow clicks back to be pressable
       * at all. In here it is an ordinary button next to the other step
       * controls, and it is available throughout rather than only once the
       * narration has finished — wanting a step repeated is most likely while
       * it is still running.
       */
      replayBtn.addEventListener("click", () => { if (result) play(0); });

      saveBtn.addEventListener("click", async () => {
        if (!result || result.source !== "model") return;
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        const res = await window.cairn.saveTrail({
          title: result.title, question: lastQuestion, app: result.app, steps: result.steps,
        });
        if (res.ok) {
          saveBtn.textContent = "Saved ✓";
          saveBtn.style.color = "var(--moss)";
        } else {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save as trail";
          showError(res.error);
        }
      });

      q.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); ask(); }
      });

      /*
       * Escape means stop, everything, now.
       *
       * It is the key people reach for when something is talking over them and
       * they want it gone. Unwinding one level at a time makes them press it
       * three times to get that, which reads as the app arguing — so one press
       * kills the voice, drops the overlay, and puts Cairn away.
       */
      window.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        e.preventDefault();
        closeEverything();
      });

      // The same key, arriving from the main process for the times this window
      // is hidden or unfocused and never sees the keystroke itself.
      window.cairn.onEscape(() => closeEverything());

      /** Stop everything: voice, walkthrough, overlay, panel. */
      function closeEverything() {
        takeManualControl();
        clearInterval(thinkingTimer);
        thinkingTimer = null;
        // Abandons any question already with the model, so an answer that
        // lands after this can't start a walkthrough.
        flowId += 1;
        window.cairn.stage({ kind: "off" });
        window.cairn.voiceMode(false);
        if (recording) {
          recording = false;
          try { if (recorder?.state === "recording") recorder.stop(); } catch {}
          try { stream?.getTracks().forEach((t) => t.stop()); } catch {}
          mic.classList.remove("recording");
          micLabel.textContent = "Speak";
          level.classList.remove("on");
        }
        // Always, not only while recording: the socket outlives the recorder
        // when Escape lands between the last word and the answer.
        try { socket?.close(); } catch {}
        socket = null;
        clearAnswer();
        window.cairn.dismiss();
      }

      window.cairn.onSummon(() => {
        q.value = "";
        clearAnswer();
        q.focus();
        // Speak is one click away from here — have the credential ready before
        // it is asked for.
        prefetchListenToken();
      });

      fit();
    </script>
  </body>
</html>
